name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if ! PUPPETEER_SKIP_DOWNLOAD=true npm ci > /tmp/npmci.log 2>&1; then
            MSG=$(tail -c 1500 /tmp/npmci.log | tr '\n' '|')
            echo "::error title=npm ci failed::$MSG"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret
