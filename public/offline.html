<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sedang Offline — E-Rapor</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; padding: 32px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center; background: #0f172a; color: #e2e8f0;
    }
    .badge { font-size: 48px; }
    h2 { margin: 0; font-size: 20px; }
    p { margin: 0; max-width: 28rem; line-height: 1.5; color: #94a3b8; }
    button {
      margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 10px;
      background: #22c55e; color: #062417; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">📴</div>
  <h2>Kamu sedang offline</h2>
  <p>Beberapa data rapor mungkin belum terbaru. Halaman ini akan otomatis menutup saat koneksi kembali.</p>
  <button onclick="location.reload()">Coba lagi</button>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
